<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matriz de alunos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="matriz.css">
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <div class="titulo">
        <h1>Matriz</h1>
        <p id="resumo" class="resumo" aria-live="polite">A carregar…</p>
        <p class="dica">Cada célula conta os alunos de um curso num ano. Clica numa célula para ver quem são.</p>
      </div>
      <div class="acoes-topo">
        <a href="index.html" class="btn btn-secundario">Ver alunos</a>
        <button id="btnImprimir" class="btn btn-primario" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7"/></svg>
          Imprimir
        </button>
      </div>
    </header>

    <main>
      <div id="matriz" class="matriz-caixa" aria-busy="true"></div>
      <section id="detalhe" class="detalhe" aria-live="polite" aria-label="Alunos da célula escolhida"></section>
      <section id="impressao" class="impressao" aria-hidden="true"></section>
    </main>
  </div>

  <script src="matriz.js"></script>
</body>
</html>
